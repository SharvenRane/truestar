# Docs site for Truestar. Built locally with `mkdocs build --strict`; not deployed anywhere.
# GitHub Pages: .github/workflows/docs.yml (manual dispatch only). Read the Docs: .readthedocs.yaml.
site_name: Truestar
site_description: "The same answer on every chip: find where an ML model's results diverge across backends."
site_author: Sharven Rane
site_url: https://sharvenrane.github.io/truestar/
repo_url: https://github.com/SharvenRane/truestar
repo_name: SharvenRane/truestar
edit_uri: edit/main/docs/
copyright: Copyright 2026 Sharven Rane. Apache License 2.0.

docs_dir: docs
site_dir: site
theme:
  name: readthedocs
  navigation_depth: 3

# Internal notes and unfiled upstream drafts stay in the repo but out of the site.
exclude_docs: |
  upstream/

validation:
  links:
    # docs link to ../AGENTS.md and ../README.md, which live outside docs_dir
    not_found: info
    unrecognized_links: info
  omitted_files: info

