name: metal

# Manual only: macOS minutes are limited on the free plan. Runs the Metal backend's tests
# (tests/test_metal.py: kernels, the compiled executor end to end, `truestar check --backends metal`;
# the Metal parts of the order free sum, round once, linear attention and orderprobe tests)
# and scripts/metal_e2e.py on a hosted Apple silicon runner. docs/METAL.md.
on:
  workflow_dispatch:
    inputs:
      torch:
        description: "torch version (2.15+ refuses the runners' paravirtual GPU, see pytorch#202529)"
        default: "2.14.1"
      tests:
        description: "pytest selection"
        default: "tests/test_metal.py tests/test_ordersum.py tests/test_roundonce.py tests/test_linattn.py tests/test_orderprobe.py tests/test_conform_coreml.py"

permissions:
  contents: read

jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${{ inputs.torch }}" numpy pytest mpmath
      - name: Probe
        env:
          PYTHONPATH: src
        run: |
          python -c "import platform, torch; print(platform.platform(), torch.__version__, torch.backends.mps.is_available())"
          python -c "from truestar.kernel import metal_backend as mb; print('metal', mb.unavailable_reason(), 'simdgroup', mb.simdgroup_probe())"
          python scripts/mps_copy_probe.py
      - name: Tests
        if: always()
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider -rfs -s ${{ inputs.tests }} tests/test_codes_unique.py 2>&1 | tee metal-tests.txt
      - name: End to end against MPS eager
        if: always()
        env:
          PYTHONPATH: src
        run: python scripts/metal_e2e.py --json metal-e2e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal
          path: |
            metal-tests.txt
            metal-e2e.json
