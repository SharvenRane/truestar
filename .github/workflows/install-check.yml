name: install-check

# Fresh install check on Windows, Linux and macOS: build the sdist and wheel, install the wheel into
# a new venv that holds only CPU torch, then from a directory outside the checkout import it, run
# the CLI, run the README_DRAFT quickstart (scripts/install_quickstart.py), add the documented
# extras and run a CPU smoke subset of the tests against the installed wheel.
# Runs on push to install-check/** branches or by hand, not on every push (Actions minutes).
on:
  push:
    branches: ["install-check/**"]
  workflow_dispatch:
    inputs:
      torch:
        description: "torch version from the CPU index (empty: the latest, what a new user gets)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  TORCH_PIN: ${{ inputs.torch }}
  BUILD_VERSION: "1.6.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  CUDA_VISIBLE_DEVICES: ""

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install "build==$BUILD_VERSION"
          python -m build
          ls -l dist
          python -m zipfile -l dist/*.whl

      - name: Fresh venv with CPU torch and the wheel, no extras
        run: |
          V="$RUNNER_TEMP/fresh"
          python -m venv "$V"
          if [ -x "$V/Scripts/python.exe" ]; then BIN="$V/Scripts"; else BIN="$V/bin"; fi
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/python" -m pip install --index-url "$TORCH_INDEX" "torch${TORCH_PIN:+==$TORCH_PIN}"
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -m pip list

      - name: Import and CLI, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import truestar"
          python -c "import sys, torch, truestar; print(truestar.__version__, truestar.__file__, 'torch', torch.__version__); sys.exit(0 if 'site-packages' in truestar.__file__ else 'truestar is not the installed wheel')"
          truestar --help
          truestar backends

      - name: README_DRAFT quickstart, outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/scripts/install_quickstart.py" "$GITHUB_WORKSPACE"

      - name: Documented extras (cpu-kernels, mcp) and pytest
        run: |
          WHL=$(ls dist/*.whl)
          python -m pip install "${WHL}[cpu-kernels,mcp]" pytest
          python -m pip list

      - name: CPU smoke tests against the installed wheel, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          # A copy of tests/ with no src/ beside it: tests that put ../src on PYTHONPATH for child
          # processes find nothing there and import the installed wheel too.
          S="$RUNNER_TEMP/smoke"
          mkdir -p "$S"
          cp -r "$GITHUB_WORKSPACE/tests" "$GITHUB_WORKSPACE/examples" "$GITHUB_WORKSPACE/docs" "$S/"
          cp "$GITHUB_WORKSPACE/scripts/install_smoke_conftest.py" "$S/tests/conftest.py"
          cd "$S"
          test ! -e src
          python -m pytest -q -p no:cacheprovider -rs --durations=10 \
            tests/test_codes_unique.py tests/test_optional_deps.py tests/test_check.py tests/test_agent.py \
            -k "not mcp or mcp_check_model_clean or sdk_2x"
